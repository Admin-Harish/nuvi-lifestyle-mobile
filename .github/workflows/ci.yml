name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      - name: Assert .env.example contains names only
        run: |
          if grep -vE '^\s*(#.*)?$' .env.example | grep -vE '^[A-Z0-9_]+=$'; then
            echo "::error::.env.example must contain variable NAMES ONLY."
            exit 1
          fi
          echo ".env.example contains names only."

      - name: Assert no hardcoded localhost outside development
        run: |
          # The dev fallback in app_config.dart is the ONLY permitted mention.
          offenders=$(grep -rniE 'localhost|127\.0\.0\.1|10\.0\.2\.2' lib/ \
            | grep -v 'lib/config/app_config.dart' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Hardcoded local address outside the development fallback:"
            echo "$offenders"
            exit 1
          fi
          echo "No hardcoded local addresses in shipped configuration."

  build-android:
    name: Build Android (dev flavor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build dev flavor
        run: |
          flutter build apk --debug \
            --flavor dev \
            -t lib/main_dev.dart \
            --dart-define=API_BASE_URL=http://localhost:8000

      - name: Assert the shipping-build API_BASE_URL guard is present in source
        run: |
          # A static check, not a build. AppConfig.resolve throws at *startup*,
          # not at compile time, so a staging build with no API_BASE_URL still
          # compiles — it just refuses to run. The behaviour itself is covered
          # by the unit tests in the analyze-and-test job; this step only
          # catches someone deleting the guard.
          if ! grep -q 'API_BASE_URL was not provided' lib/config/app_config.dart; then
            echo "::error::The staging/production API_BASE_URL guard is missing."
            exit 1
          fi
          echo "Shipping-build guard present in source."
